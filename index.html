<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin Exchange</title>
  <meta name="description" content="Coin Exchange — a virtual coin management and exchange game." />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23E7A100'/%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%232B2A33' stroke-width='1.4'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,440;9..144,560;9..144,650&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <div id="app" class="app-shell">
    <!-- App is rendered here by js/app.js -->
    <div class="boot-loader" role="status" aria-label="Loading Coin Exchange">
      <div class="boot-mark">
        <span class="boot-coin boot-coin--gold"></span>
        <span class="boot-coin boot-coin--purple"></span>
      </div>
      <p>Loading Coin Exchange&hellip;</p>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
